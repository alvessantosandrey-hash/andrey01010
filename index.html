<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Paintball JS Edition</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: white; font-family: sans-serif; }
        canvas { background: #fff; border: 5px solid #555; cursor: crosshair; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Paintball Multiplayer</h1>
        <p>Use **WASD** para mover | **Clique** para atirar</p>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 800;
    canvas.height = 600;

    // Configurações do Jogador
    const player = {
        x: 400,
        y: 300,
        radius: 15,
        color: 'blue',
        speed: 4
    };

    const projectiles = [];
    const keys = {};

    // Detectar teclas
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // Atirar
    window.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        // Calcular ângulo do tiro
        const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
        
        projectiles.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(angle) * 7,
            vy: Math.sin(angle) * 7,
            color: player.color
        });
    });

    function update() {
        // Movimentação
        if (keys['w'] && player.y > player.radius) player.y -= player.speed;
        if (keys['s'] && player.y < canvas.height - player.radius) player.y += player.speed;
        if (keys['a'] && player.x > player.radius) player.x -= player.speed;
        if (keys['d'] && player.x < canvas.width - player.radius) player.x += player.speed;

        // Atualizar projéteis
        projectiles.forEach((p, index) => {
            p.x += p.vx;
            p.y += p.vy;

            // Remover se sair da tela
            if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                projectiles.splice(index, 1);
            }
        });
    }

    function draw() {
        // Limpar rastro (para efeito de paintball, você pode não limpar tudo!)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Desenhar Jogador
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.fill();
        ctx.closePath();

        // Desenhar Tiros
        projectiles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.closePath();
        });

        requestAnimationFrame(() => {
            update();
            draw();
        });
    }

    draw();
</script>
</body>
</html>
