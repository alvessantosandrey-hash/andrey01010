<script type="module">
import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
import { PointerLockControls } from 'https://unpkg.com/three@0.158.0/examples/jsm/controls/PointerLockControls.js';

let camera, scene, renderer, controls;
const balls = [];
const obstacles = [];
const clock = new THREE.Clock();

init();
animate();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 10, 50);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Luz
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    light.castShadow = true;
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x606060));

    // Chão
    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(100, 100),
        new THREE.MeshPhysicalMaterial({ color: 0x228b22 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Obstáculos
    for (let i = 0; i < 20; i++) {
        const box = new THREE.Mesh(
            new THREE.BoxGeometry(2, 3, 2),
            new THREE.MeshPhysicalMaterial({ color: 0x8b4513 })
        );
        box.position.set(Math.random() * 40 - 20, 1.5, Math.random() * 40 - 20);
        box.castShadow = true;
        scene.add(box);
        obstacles.push(box);
    }

    // Controlo de movimento
    controls = new PointerLockControls(camera, document.body);
    document.body.addEventListener('click', () => controls.lock());

    // Disparo
    document.addEventListener('mousedown', () => {
        if (controls.isLocked) shoot();
    });

    window.addEventListener('resize', onWindowResize);
}

function shoot() {
    const ball = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 12, 12),
        new THREE.MeshStandardMaterial({ color: new THREE.Color(`hsl(${Math.random()*360}, 100%, 50%)`) })
    );
    ball.position.copy(camera.position);

    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    ball.userData.velocity = dir.multiplyScalar(10);

    scene.add(ball);
    balls.push(ball);
}

function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    balls.forEach((b, i) => {
        b.position.addScaledVector(b.userData.velocity, delta);
        b.userData.velocity.y -= 9.8 * delta; // gravidade

        if (b.position.y <= 0) {
            scene.remove(b);
            balls.splice(i, 1);
        }
    });

    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>
