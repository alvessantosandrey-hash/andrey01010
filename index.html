<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Paintball Pro - 2 Players</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; font-family: 'Arial Black', sans-serif; overflow: hidden; }
        canvas { background: #f0f0f0; border: 6px solid #333; border-radius: 8px; cursor: none; }
        .ui-container { display: flex; width: 800px; justify-content: space-between; margin-bottom: 10px; }
        .health-bar-bg { width: 300px; height: 25px; background: #444; border: 2px solid #000; position: relative; }
        .health-bar-fill { height: 100%; transition: width 0.1s; }
        #hp1 { background: #3498db; width: 100%; }
        #hp2 { background: #e74c3c; width: 100%; }
        .label { font-size: 14px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="ui-container">
        <div>
            <div class="label">PLAYER 1 (WASD / CONTROLE 1)</div>
            <div class="health-bar-bg"><div id="hp1" class="health-bar-fill"></div></div>
            <div id="val1">3000 / 3000</div>
        </div>
        <div>
            <div class="label" style="text-align: right;">PLAYER 2 (SETAS / CONTROLE 2)</div>
            <div class="health-bar-bg"><div id="hp2" class="health-bar-fill"></div></div>
            <div id="val2" style="text-align: right;">3000 / 3000</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800;
    canvas.height = 500;

    const MAX_HP = 3000;
    const DAMAGE = 100;

    const players = {
        p1: { x: 100, y: 250, color: '#3498db', radius: 18, hp: MAX_HP, id: "hp1", valId: "val1" },
        p2: { x: 700, y: 250, color: '#e74c3c', radius: 18, hp: MAX_HP, id: "hp2", valId: "val2" }
    };

    let projectiles = [];
    let splatters = [];
    const keys = {};

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function shoot(player, target) {
        const angle = Math.atan2(target.y - player.y, target.x - player.x);
        projectiles.push({
            x: player.x, y: player.y,
            vx: Math.cos(angle) * 10,
            vy: Math.sin(angle) * 10,
            color: player.color,
            owner: player
        });
    }

    function updateHealthUI(player) {
        const percent = (player.hp / MAX_HP) * 100;
        document.getElementById(player.id).style.width = percent + "%";
        document.getElementById(player.valId).innerText = `${Math.max(0, player.hp)} / ${MAX_HP}`;
    }

    function handleGamepad() {
        const gamepads = navigator.getGamepads();
        
        // Controle do Player 1 (Índice 0)
        if (gamepads[0]) {
            const gp = gamepads[0];
            if (Math.abs(gp.axes[0]) > 0.1) players.p1.x += gp.axes[0] * 5;
            if (Math.abs(gp.axes[1]) > 0.1) players.p1.y += gp.axes[1] * 5;
            // Botão "X" no PS2 (geralmente botão 0 ou 2 dependendo do mapeamento)
            if (gp.buttons[0].pressed) { shoot(players.p1, players.p2); }
        }

        // Controle do Player 2 (Índice 1)
        if (gamepads[1]) {
            const gp = gamepads[1];
            if (Math.abs(gp.axes[0]) > 0.1) players.p2.x += gp.axes[0] * 5;
            if (Math.abs(gp.axes[1]) > 0.1) players.p2.y += gp.axes[1] * 5;
            if (gp.buttons[0].pressed) { shoot(players.p2, players.p1); }
        }
    }

    function update() {
        handleGamepad();

        // Teclado P1
        if (keys['KeyW'] && players.p1.y > 20) players.p1.y -= 5;
        if (keys['KeyS'] && players.p1.y < canvas.height - 20) players.p1.y += 5;
        if (keys['KeyA'] && players.p1.x > 20) players.p1.x -= 5;
        if (keys['KeyD'] && players.p1.x < canvas.width - 20) players.p1.x += 5;
        if (keys['Space']) { shoot(players.p1, players.p2); keys['Space'] = false; }

        // Teclado P2
        if (keys['ArrowUp'] && players.p2.y > 20) players.p2.y -= 5;
        if (keys['ArrowDown'] && players.p2.y < canvas.height - 20) players.p2.y += 5;
        if (keys['ArrowLeft'] && players.p2.x > 20) players.p2.x -= 5;
        if (keys['ArrowRight'] && players.p2.x < canvas.width - 20) players.p2.x += 5;
        if (keys['Enter']) { shoot(players.p2, players.p1); keys['Enter'] = false; }

        // Projéteis e Colisões
        projectiles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy;
            
            let target = (p.owner === players.p1) ? players.p2 : players.p1;
            let dist = Math.hypot(p.x - target.x, p.y - target.y);

            if (dist < target.radius + 5) {
                target.hp -= DAMAGE;
                updateHealthUI(target);
                for(let j=0; j<5; j++) { // Criar várias manchas no impacto
                    splatters.push({
                        x: p.x + (Math.random()-0.5)*20, 
                        y: p.y + (Math.random()-0.5)*20, 
                        color: p.color, 
                        r: Math.random() * 8 + 4
                    });
                }
                projectiles.splice(i, 1);
            }

            if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                projectiles.splice(i, 1);
            }
        });

        if(players.p1.hp <= 0 || players.p2.hp <= 0) {
            alert("FIM DE JOGO! Recarregue a página.");
            location.reload();
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        splatters.forEach(s => {
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = s.color;
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        for (let id in players) {
            let p = players[id];
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        projectiles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
        });

        requestAnimationFrame(() => {
            update();
            draw();
        });
    }

    draw();
</script>
</body>
</html>
