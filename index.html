<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Paintball Fullscreen - 2 Players</title>
    <style>
        body { 
            margin: 0; 
            padding: 0;
            background: #1a1a1a; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            width: 100vw;
            color: white; 
            font-family: 'Arial Black', sans-serif; 
            overflow: hidden; 
        }

        /* Canvas agora ocupa a tela toda */
        canvas { 
            background: #f0f0f0; 
            display: block;
        }

        .ui-container { 
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex; 
            justify-content: space-between; 
            pointer-events: none; /* Deixa os cliques passarem para o jogo */
            z-index: 10;
        }

        .health-bar-bg { width: 250px; height: 20px; background: #444; border: 2px solid #000; }
        .health-bar-fill { height: 100%; transition: width 0.1s; }
        #hp1 { background: #3498db; width: 100%; }
        #hp2 { background: #e74c3c; width: 100%; }
        
        #fullscreen-btn {
            position: absolute;
            bottom: 20px;
            padding: 10px 20px;
            background: #2ecc71;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            z-index: 100;
        }
    </style>
</head>
<body>

    <button id="fullscreen-btn">MODO TELA CHEIA</button>

    <div class="ui-container">
        <div>
            <div class="health-bar-bg"><div id="hp1" class="health-bar-fill"></div></div>
            <div id="val1">3000 HP</div>
        </div>
        <div>
            <div class="health-bar-bg"><div id="hp2" class="health-bar-fill"></div></div>
            <div id="val2" style="text-align: right;">3000 HP</div>
        </div>
    </div>
