<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Shadow: Combat Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Verdana', sans-serif; }
        canvas { display: block; }
        #stats {
            position: absolute; top: 20px; left: 20px; color: white;
            text-shadow: 2px 2px #000; pointer-events: none;
        }
        .key-hint { color: #ff3e3e; font-weight: bold; }
    </style>
</head>
<body>

    <div id="stats">
        <h2 id="scoreText">KILLS: 0</h2>
        <p>MOVER: <span class="key-hint">SETAS</span> | PULO DUPLO: <span class="key-hint">ESPAÇO (2x)</span></p>
        <p>ATAQUE/DASH: <span class="key-hint">Z</span> | ESQUIVA: <span class="key-hint">BAIXO</span></p>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let screenShake = 0;

    // Configurações de Física
    const gravity = 0.9;
    const friction = 0.82;

    class Entity {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.width = 40;
            this.height = 60;
            this.velX = 0;
            this.velY = 0;
            this.color = color;
        }
    }

    class Ninja extends Entity {
        constructor() {
            super(100, canvas.height - 100, "#fff");
            this.grounded = false;
            this.jumpCount = 0;
            this.isDashing = false;
            this.dashCooldown = 0;
        }

        update() {
            this.velY += gravity;
            this.velX *= friction;
            this.x += this.velX;
            this.y += this.velY;

            // Chão
            if (this.y + this.height > canvas.height - 50) {
                this.y = canvas.height - 50 - this.height;
                this.velY = 0;
                this.grounded = true;
                this.jumpCount = 0;
            }

            if (this.dashCooldown > 0) this.dashCooldown--;
            if (Math.abs(this.velX) < 8) this.isDashing = false;

            this.draw();
        }

        draw() {
            ctx.save();
            // Efeito de movimento brusco (fantasma)
            if (this.isDashing) {
                ctx.globalAlpha = 0.4;
                ctx.fillStyle = "#00f2ff";
                ctx.fillRect(this.x - (this.velX * 1.5), this.y, this.width, this.height);
            }
            
            ctx.globalAlpha = 1;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.width, this.height);
            // Máscara
            ctx.fillStyle = "#333";
            ctx.fillRect(this.x, this.y + 12, this.width, 12);
            ctx.restore();
        }
    }

        constructor() {
            super(canvas.width + 100, canvas.height - 110, "#ff3e3e");
            this.speed = Math
