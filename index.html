<!DOCTYPE html>
<html>
<head>
    <title>3D Fighter - Shield & Physics</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui { position: absolute; width: 100%; display: flex; justify-content: space-around; padding: 20px; box-sizing: border-box; pointer-events: none; }
        .hp-container { width: 350px; background: rgba(255,255,255,0.1); border: 2px solid #fff; padding: 5px; border-radius: 5px; }
        .hp-bar { height: 20px; background: #2ecc71; width: 100%; transition: width 0.1s; }
        #msg { position: absolute; top: 40%; width: 100%; text-align: center; color: white; font-size: 50px; display: none; font-weight: bold; }
        .controls-info { position: absolute; bottom: 10px; left: 10px; color: #aaa; font-size: 12px; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="hp-container">
            <div style="color: #2ecc71;">P1: WASD + SPACE (Ataque) + Q (Defesa)</div>
            <div class="hp-bar" id="hp1"></div>
        </div>
        <div class="hp-container">
            <div style="color: #e74c3c; text-align: right;">P2: CONTROLE (A: Pulo, X: Soco, B: Defesa)</div>
            <div class="hp-bar" id="hp2" style="background: #e74c3c; float: right;"></div>
        </div>
    </div>
    <div id="msg">VITÓRIA!</div>
    <div class="controls-info">Pulo bloqueado durante ataques | Defesa reduz dano a 0.</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        const world = new CANNON.World();
        world.gravity.set(0, -30, 0);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Chão
        const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(12, 0.5, 6)) });
        world.addBody(groundBody);
        const groundMesh = new THREE.Mesh(new THREE.BoxGeometry(24, 1, 12), new THREE.MeshPhongMaterial({ color: 0x111111 }));
        scene.add(groundMesh);

        scene.add(new THREE.AmbientLight(0x404040));
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 7);
        scene.add(light);

        class Fighter {
            constructor(x, color, id) {
                this.id = id;
                this.hp = 100;
                this.isDefending = false;
                this.isAttacking = false;
                this.canJump = true;
                this.baseColor = color;

                this.group = new THREE.Group();
                this.mat = new THREE.MeshPhongMaterial({ color });
                
                // Corpo Simples
                this.torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 0.6), this.mat);
                this.group.add(this.torso);
                
                // Braços
                this.armL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1, 0.4), this.mat);
                this.armL.position.set(0.8, 0.2, 0);
                this.group.add(this.armL);
                
                this.armR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1, 0.4), this.mat);
                this.armR.position.set(-0.8, 0.2, 0);
                this.group.add(this.armR);

                scene.add(this.group);

                this.body = new CANNON.Body({ 
                    mass: 1, 
                    shape: new CANNON.Box(new CANNON.Vec3(0.6, 1, 0.3)), 
                    position: new CANNON.Vec3(x, 5, 0),
                    fixedRotation: true 
                });
                world.addBody(this.body);

                // Detectar contato com o chão para resetar pulo
                this.body.addEventListener("collide", (e) => {
                    if (Math.abs(e.contact.ni.y) > 0.5) this.canJump = true;
                });
            }

            update() {
                this.group.position.copy(this.body.position);
                
                // Visual de Defesa
                if (this.isDefending) {
                    this.mat.color.setHex(0x3498db);
                    this.group.scale.set(0.9, 0.9, 0.9);
                } else if (this.isAttacking) {
                    this.mat.color.setHex(0xffffff);
                } else {
                    this.mat.color.setHex(this.baseColor);
                    this.group.scale.set(1, 1, 1);
                }

                if (this.body.position.y < -10) this.die();
            }

            die() {
                this.hp = 0;
                document.getElementById('msg').style.display = 'block';
                document.getElementById('msg').innerText = `JOGADOR ${this.id === 1 ? 2 : 1} VENCEU!`;
                setTimeout(() => location.reload(), 2000);
            }
        }

        const p1 = new Fighter(-5, 0x2ecc71, 1);
        const p2 = new Fighter(5, 0 e74c3c, 2);

        const keys = {};
        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;

        function handleInputs() {
            const gps = navigator.getGamepads();
            const speed = 8;

            // --- PLAYER 1 (Teclado) ---
            p1.isDefending = keys['KeyQ'];
            p1.isAttacking = keys['Space'];

            if (!p1.isDefending) {
                p1.body.velocity.x = 0;
                if (keys['KeyA']) p1.body.velocity.x = -speed;
                if (keys['KeyD']) p1.body.velocity.x = speed;
                
                // Pulo: Só se puder pular E não estiver atacando
                if (keys['KeyW'] && p1.canJump && !p1.isAttacking) {
                    p1.body.velocity.y = 15;
                    p1.canJump = false;
                }
            } else {
                p1.body.velocity.x = 0; // Travado na defesa
            }

            // --- PLAYER 2 (Controle) ---
            const gp2 = gps[1] || gps[0]; // Usa o que estiver disponível para teste
            if (gp2) {
                p2.isDefending = gp2.buttons[1].pressed; // Botão B / Círculo
                p2.isAttacking = gp2.buttons[2].pressed; // Botão X / Quadrado

                if (!p2.isDefending) {
                    p2.body.velocity.x = (Math.abs(gp2.axes[0]) > 0.2) ? gp2.axes[0] * speed : 0;
                    if (gp2.buttons[0].pressed && p2.canJump && !p2.isAttacking) {
                        p2.body.velocity.y = 15;
                        p2.canJump = false;
                    }
                } else {
                    p2.body.velocity.x = 0;
                }
            }

            // Lógica de Dano
            if (p1.isAttacking) attack(p1, p2);
            if (p2.isAttacking) attack(p2, p1);
        }

        function attack(attacker, victim) {
            const dist = attacker.body.position.distanceTo(victim.body.position);
            if (dist < 2.2) {
                if (!victim.isDefending) {
                    victim.hp -= 0.5;
                    updateUI();
                    const dir = (victim.body.position.x - attacker.body.position.x) > 0 ? 1 : -1;
                    victim.body.applyImpulse(new CANNON.Vec3(dir * 1.5, 1, 0), victim.body.position);
                    if (victim.hp <= 0) victim.die();
                }
            }
        }

        function updateUI() {
            document.getElementById('hp1').style.width = p1.hp + "%";
            document.getElementById('hp2').style.width = p2.hp + "%";
        }

        camera.position.set(0, 5, 15);
        camera.lookAt(0,0,0);

        function animate() {
            requestAnimationFrame(animate);
            world.step(1/60);
            handleInputs();
            p1.update();
            p2.update();
            camera.position.x = (p1.body.position.x + p2.body.position.x) / 2;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
