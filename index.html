<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Paintball Online</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { background: #eee; border: 4px solid #444; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800; canvas.height = 600;

        let players = {};
        let projectiles = [];
        const keys = {};

        // Eventos do Socket
        socket.on('currentPlayers', (serverPlayers) => { players = serverPlayers; });
        socket.on('newPlayer', (newPlayer) => { players[newPlayer.id] = newPlayer; });
        socket.on('playerMoved', (p) => { players[p.id] = p; });
        socket.on('playerDisconnected', (id) => { delete players[id]; });
        socket.on('enemyShot', (data) => { projectiles.push(data); });

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        canvas.addEventListener('mousedown', (e) => {
            const me = players[socket.id];
            if (!me) return;
            const rect = canvas.getBoundingClientRect();
            const angle = Math.atan2(e.clientY - rect.top - me.y, e.clientX - rect.left - me.x);
            
            const shot = { x: me.x, y: me.y, vx: Math.cos(angle) * 8, vy: Math.sin(angle) * 8, color: me.color };
            projectiles.push(shot);
            socket.emit('shoot', shot); // Avisa o servidor do tiro
        });

        function update() {
            const me = players[socket.id];
            if (me) {
                let moved = false;
                if (keys['w']) { me.y -= 4; moved = true; }
                if (keys['s']) { me.y += 4; moved = true; }
                if (keys['a']) { me.x -= 4; moved = true; }
                if (keys['d']) { me.x += 4; moved = true; }
                if (moved) socket.emit('playerMovement', { x: me.x, y: me.y });
            }

            projectiles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > 800 || p.y < 0 || p.y > 600) projectiles.splice(i, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Desenha todos os jogadores
            Object.values(players).forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.strokeStyle = p.id === socket.id ? 'black' : 'transparent';
                ctx.lineWidth = 3;
                ctx.stroke();
            });

            // Desenha tiros
            projectiles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            });

            requestAnimationFrame(() => { update(); draw(); });
        }
        draw();
    </script>
</body>
</html>
