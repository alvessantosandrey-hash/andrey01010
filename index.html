<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>3D Fighter Multiplayer</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5); padding: 10px; }
        #chat { position: absolute; bottom: 10px; left: 10px; }
    </style>
</head>
<body>

    <div id="ui">
        <h2>3D Multiplayer Arena</h2>
        <p>Seu ID: <span id="my-id">3455</span></p>
        <input type="text" id="peer-id-input" placeholder="ID do oponente">
        <button onclick="connectToPeer()">Conectar e Lutar</button>
        <div id="status">Aguardando conexão...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        // --- CONFIGURAÇÃO INICIAL ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- FÍSICA ---
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        // --- CHÃO ---
        const groundGeo = new THREE.PlaneGeometry(20, 20);
        const groundMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const groundBody = new CANNON.Body({ mass: 0 });
        groundBody.addShape(new CANNON.Plane());
        groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(groundBody);

        // --- JOGADORES (Cubos para simplificar) ---
        function createPlayer(color, startX) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(1, 2, 1),
                new THREE.MeshPhongMaterial({ color: color })
            );
            scene.add(mesh);

            const body = new CANNON.Body({
                mass: 1,
                shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)),
                position: new CANNON.Vec3(startX, 5, 0)
            });
            world.addBody(body);
            return { mesh, body };
        }

        const player = createPlayer(0x00ff00, -2);
        const opponent = createPlayer(0xff0000, 2);

        // Iluminação
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        camera.position.z = 10;
        camera.position.y = 5;
        camera.lookAt(0, 0, 0);

        // --- MULTIPLAYER (PeerJS) ---
        const peer = new Peer();
        let conn;

        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
        });

        peer.on('connection', (c) => {
            conn = c;
            setupDataHandlers();
        });

        function connectToPeer() {
            const remoteId = document.getElementById('peer-id-input').value;
            conn = peer.connect(remoteId);
            setupDataHandlers();
        }

        function setupDataHandlers() {
            conn.on('open', () => {
                document.getElementById('status').innerText = "Conectado!";
                setInterval(() => {
                    conn.send({
                        x: player.body.position.x,
                        y: player.body.position.y,
                        z: player.body.position.z
                    });
                }, 50);
            });

            conn.on('data', (data) => {
                opponent.body.position.set(data.x, data.y, data.z);
            });
        }

        // --- CONTROLES ---
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function updateMovement() {
            const speed = 0.1;
            if (keys['ArrowLeft']) player.body.position.x -= speed;
            if (keys['ArrowRight']) player.body.position.x += speed;
            if (keys['Space'] && Math.abs(player.body.velocity.y) < 0.1) player.body.velocity.y = 5;
        }

        // --- LOOP DE ANIMAÇÃO ---
        function animate() {
            requestAnimationFrame(animate);
            world.step(1/60);
            updateMovement();

            // Sincronizar malha visual com corpo físico
            player.mesh.position.copy(player.body.position);
            player.mesh.quaternion.copy(player.body.quaternion);
            opponent.mesh.position.copy(opponent.body.position);
            opponent.mesh.quaternion.copy(opponent.body.quaternion);

            renderer.render(scene, camera);
        }
        animate();

    </script>
</body>
</html>
