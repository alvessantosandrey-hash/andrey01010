<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Desafio do Arremesso 3D-ish</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { background: linear-gradient(#444, #111); border: 4px solid #fff; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #ui { position: absolute; top: 20px; text-align: center; pointer-events: none; }
        .stats { font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stats">Pontos: <span id="score">0</span></div>
        <p>Clique e arraste para trás para mirar | Solte para arremessar</p>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    canvas.width = 800;
    canvas.height = 500;

    // Física e Jogo
    let score = 0;
    const gravity = 0.5;
    let isDragging = false;
    let mouseStart = { x: 0, y: 0 };
    let mouseCurrent = { x: 0, y: 0 };

    const ball = {
        x: 100, y: 400, radius: 15,
        vx: 0, vy: 0, 
        active: false,
        color: '#e67e22'
    };

    const hoop = {
        x: 650, y: 150, width: 80, height: 10
    };

    function resetBall() {
        ball.active = false;
        ball.x = 100;
        ball.y = 400;
        ball.vx = 0;
        ball.vy = 0;
    }

    canvas.addEventListener('mousedown', (e) => {
        if (!ball.active) {
            const rect = canvas.getBoundingClientRect();
            mouseStart.x = e.clientX - rect.left;
            mouseStart.y = e.clientY - rect.top;
            isDragging = true;
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        if (isDragging) {
            const rect = canvas.getBoundingClientRect();
            mouseCurrent.x = e.clientX - rect.left;
            mouseCurrent.y = e.clientY - rect.top;
        }
    });

    window.addEventListener('mouseup', (e) => {
        if (isDragging) {
            const dx = mouseStart.x - mouseCurrent.x;
            const dy = mouseStart.y - mouseCurrent.y;
            
            // Lançamento (Força proporcional ao arrasto)
            ball.vx = dx * 0.15;
            ball.vy = dy * 0.15;
            ball.active = true;
            isDragging = false;
        }
    });

    function update() {
        if (ball.active) {
            ball.vy += gravity; // Gravidade
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Colisão com a cesta (Simplificada)
            if (ball.x > hoop.x && ball.x < hoop.x + hoop.width &&
                ball.y > hoop.y && ball.y < hoop.y + hoop.height && ball.vy > 0) {
                score++;
                scoreElement.innerText = score;
                resetBall();
            }

            // Resetar se sair da tela
            if (ball.y > canvas.height || ball.x > canvas.width) {
                resetBall();
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Desenhar Cesta
        ctx.fillStyle = 'red';
        ctx.fillRect(hoop.x, hoop.y, hoop.width, hoop.height);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(hoop.x + 5, hoop.y + 10, hoop.width - 10, 60); // Rede

        // Desenhar Trajetória (Linha de mira)
        if (isDragging) {
            ctx.beginPath();
            ctx.setLineDash([5, 5]);
            ctx.moveTo(ball.x, ball.y);
            ctx.lineTo(ball.x + (mouseStart.x - mouseCurrent.x) * 2, ball.y + (mouseStart.y - mouseCurrent.y) * 2);
            ctx.strokeStyle = 'white';
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Desenhar Bola
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = ball.color;
        ctx.fill();
        ctx.strokeStyle = 'black';
        ctx.stroke();
        ctx.closePath();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
