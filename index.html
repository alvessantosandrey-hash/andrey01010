<!DOCTYPE html>
<html>
<head>
    <title>3D Fighter Extreme</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #overlay { position: absolute; top: 20px; left: 20px; color: #0f0; pointer-events: none; }
        #controls-hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: white; }
    </style>
</head>
<body>
    <div id="overlay">
        <h1>ARENA 3D</h1>
        <div id="pad-status">CONTROLE: DESCONECTADO</div>
        <div id="stats">HP: 100 | 100</div>
    </div>
    <div id="controls-hint">Teclado: Setas + Espaço | Controle: Analógico + Botão A</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <script>
        // --- 1. SETUP DO MUNDO ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const world = new CANNON.World();
        world.gravity.set(0, -15, 0);

        // --- 2. MATERIAIS E CHÃO ---
        const groundMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
        const groundGeo = new THREE.BoxGeometry(30, 1, 30);
        const groundMesh = new THREE.Mesh(groundGeo, groundMat);
        scene.add(groundMesh);

        const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(15, 0.5, 15)) });
        world.addBody(groundBody);

        // Luzes
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(10, 10, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // --- 3. JOGADORES ---
        function createPlayer(x, color) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, 2, 1),
                new THREE.MeshPhongMaterial({ color: color })
            );
            scene.add(mesh);

            const body = new CANNON.Body({
                mass: 1,
                shape: new CANNON.Box(new CANNON.Vec3(0.75, 1, 0.5)),
                position: new CANNON.Vec3(x, 5, 0),
                fixedRotation: true // Impede o boneco de capotar
            });
            world.addBody(body);
            return { mesh, body };
        }

        const p1 = createPlayer(-5, 0x00ff00);
        const p2 = createPlayer(5, 0xff0000); // Inimigo estático (ou p2)

        camera.position.set(0, 5, 15);
        camera.lookAt(0, 0, 0);

        // --- 4. INPUTS (TECLADO + GAMEPAD) ---
        const keys = {};
        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;

        let gamepadIdx = null;
        window.addEventListener("gamepadconnected", (e) => {
            gamepadIdx = e.gamepad.index;
            document.getElementById('pad-status').innerText = "CONTROLE: CONECTADO";
        });

        function updateInput() {
            const moveSpeed = 8;
            const jumpForce = 10;

            // Reset Horizontal Velocity
            p1.body.velocity.x = 0;
            p1.body.velocity.z = 0;

            // Teclado
            if (keys['ArrowLeft']) p1.body.velocity.x = -moveSpeed;
            if (keys['ArrowRight']) p1.body.velocity.x = moveSpeed;
            if (keys['Space'] && Math.abs(p1.body.velocity.y) < 0.01) p1.body.velocity.y = jumpForce;

            // Gamepad
            const gp = navigator.getGamepads()[gamepadIdx];
            if (gp) {
                // Analógico Esquerdo
                if (Math.abs(gp.axes[0]) > 0.2) {
                    p1.body.velocity.x = gp.axes[0] * moveSpeed;
                }
                // Botão A (Pulo)
                if (gp.buttons[0].pressed && Math.abs(p1.body.velocity.y) < 0.01) {
                    p1.body.velocity.y = jumpForce;
                }
                // Botão X (Ataque)
                if (gp.buttons[2].pressed) {
                    p1.mesh.scale.set(1.5, 1.5, 1.5); // "Feedback visual de soco"
                } else {
                    p1.mesh.scale.set(1, 1, 1);
                }
            }
        }

        // --- 5. LOOP PRINCIPAL ---
        function animate() {
            requestAnimationFrame(animate);
            
            world.step(1/60);
            updateInput();

            // Atualiza Malhas
            p1.mesh.position.copy(p1.body.position);
            p1.mesh.quaternion.copy(p1.body.quaternion);
            
            p2.mesh.position.copy(p2.body.position);
            p2.mesh.quaternion.copy(p2.body.quaternion);

            // Câmera segue os jogadores suavemente
            const midPoint = (p1.body.position.x + p2.body.position.x) / 2;
            camera.position.x += (midPoint - camera.position.x) * 0.05;

            renderer.render(scene, camera);
        }

        animate();

        // Ajuste de tela
        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
