<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cyber-Strike 3D Multiplayer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* UI de Combate */
        #game-ui { position: absolute; width: 100%; top: 20px; display: flex; justify-content: space-around; pointer-events: none; }
        .health-bar-container { width: 40%; height: 30px; background: rgba(255,255,255,0.1); border: 2px solid #fff; position: relative; }
        .health-fill { height: 100%; width: 100%; transition: width 0.2s ease-out; }
        #health-p1 { background: linear-gradient(90deg, #00ff00, #aaff00); }
        #health-p2 { background: linear-gradient(90deg, #ff0000, #ff5500); }
        
        #connection-panel { 
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; color: #fff;
            border: 1px solid #444; text-align: center;
        }
        input { background: #222; border: 1px solid #555; color: #fff; padding: 5px; margin: 5px; }
        button { background: #007bff; color: #fff; border: none; padding: 8px 15px; cursor: pointer; border-radius: 5px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div id="game-ui">
        <div class="health-bar-container"><div id="health-p1" class="health-fill"></div></div>
        <div class="health-bar-container"><div id="health-p2" class="health-fill"></div></div>
    </div>

    <div id="connection-panel">
        <div id="status">Aguardando...</div>
        <small>Seu ID: <span id="my-id">...</span></small><br>
        <input type="text" id="peer-id-input" placeholder="ID do Oponente">
        <button onclick="connectToPeer()">Conectar para Lutar</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

    <script>
        // --- CONFIGURAÇÃO DE CENA ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000000, 10, 50);
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- FÍSICA ---
        const world = new CANNON.World();
        world.gravity.set(0, -20, 0);

        // --- CHÃO ESTILIZADO ---
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshPhongMaterial({ color: 0x111111, shininess: 100 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(100, 50, 0x00ff00, 0x222222);
        scene.add(grid);

        const groundBody = new CANNON.Body({ mass: 0 });
        groundBody.addShape(new CANNON.Plane());
        groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(groundBody);

        // --- CLASSE JOGADOR ---
        class Player {
            constructor(color, x, isLocal) {
                this.health = 100;
                this.isLocal = isLocal;
                
                // Visual
                this.mesh = new THREE.Group();
                const bodyGeo = new THREE.BoxGeometry(1, 2, 0.8);
                const bodyMat = new THREE.MeshPhongMaterial({ color: color });
                this.bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
                this.bodyMesh.castShadow = true;
                this.mesh.add(this.bodyMesh);

                // "Mão" para ataque
                this.hand = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshPhongMaterial({color: 0xffffff}));
                this.hand.position.set(0.6, 0.2, 0.5);
                this.mesh.add(this.hand);

                scene.add(this.mesh);

                // Física
                this.physicsBody = new CANNON.Body({
                    mass: 1,
                    shape: new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.4)),
                    position: new CANNON.Vec3(x, 2, 0),
                    fixedRotation: true
                });
                world.addBody(this.physicsBody);
            }

            takeDamage(amount) {
                this.health -= amount;
                if(this.health < 0) this.health = 0;
                updateUI();
            }

            attack() {
                // Animação simples de soco
                this.hand.position.z = 1.2;
                setTimeout(() => this.hand.position.z = 0.5, 100);
                return this.physicsBody.position;
            }
        }

        const p1 = new Player(0x00aaff, -3, true);
        const p2 = new Player(0xff0044, 3, false);

        // --- ILUMINAÇÃO ---
        const pLight = new THREE.PointLight(0x00ff00, 1, 20);
        pLight.position.set(0, 5, 0);
        scene.add(pLight);
        scene.add(new THREE.AmbientLight(0x444444));

        camera.position.set(0, 4, 12);
        camera.lookAt(0, 2, 0);

        // --- MULTIPLAYER & CONTROLES ---
        const peer = new Peer();
        let connection;
        const keys = {};

        peer.on('open', id => document.getElementById('my-id').innerText = id);
        peer.on('connection', conn => { connection = conn; setupNetwork(); });

        function connectToPeer() {
