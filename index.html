<!DOCTYPE html>
<html>
<head>
    <title>3D Fighter - Face to Face</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; }
        #hud { position: absolute; width: 100%; display: flex; justify-content: space-around; padding: 25px; box-sizing: border-box; pointer-events: none; }
        .hp-container { width: 42%; background: rgba(0,0,0,0.8); border: 3px solid #555; height: 30px; position: relative; border-radius: 5px; }
        .hp-fill { height: 100%; width: 100%; transition: width 0.2s ease-out; }
        #hp1 { background: #00ff88; float: left; }
        #hp2 { background: #ff3333; float: right; }
        #msg { position: absolute; top: 45%; width: 100%; text-align: center; color: #fff; font-size: 70px; display: none; text-shadow: 0 0 15px #f00; }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hp-container"><div id="hp1" class="hp-fill"></div></div>
        <div class="hp-container"><div id="hp2" class="hp-fill"></div></div>
    </div>
    <div id="msg">K.O.</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        const world = new CANNON.World();
        world.gravity.set(0, -35, 0);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Cenário e Luz
        const ground = new THREE.Mesh(new THREE.BoxGeometry(30, 2, 10), new THREE.MeshStandardMaterial({ color: 0x151515 }));
        scene.add(ground);
        const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(15, 1, 5)) });
        world.addBody(groundBody);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(5, 15, 10);
        scene.add(sun);

        class Fighter {
            constructor(x, color, id) {
                this.id = id;
                this.hp = 100;
                this.isPunching = false;
                this.isDefending = false;
                this.canJump = false;
                this.punchTimer = 0;

                this.group = new THREE.Group();
                const mat = new THREE.MeshStandardMaterial({ color });
                const skin = new THREE.MeshStandardMaterial({ color: 0xffccaa });

                // Corpo
                this.torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), mat);
                this.group.add(this.torso);
                
                this.head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), skin);
                this.head.position.y = 0.9;
                this.group.add(this.head);

                // Braços com pivô no ombro
                this.armL = this.makeArm(mat, 0.5, 0.3);
                this.armR = this.makeArm(mat, -0.5, 0.3);
                this.group.add(this.armL, this.armR);

                // Pernas
                this.legL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1, 0.3), mat);
                this.legL.position.set(0.2, -1, 0);
                this.legR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1, 0.3), mat);
                this.legR.position.set(-0.2, -1, 0);
                this.group.add(this.legL, this.legR);

                scene.add(this.group);

                this.body = new CANNON.Body({
                    mass: 1,
                    shape: new CANNON.Box(new CANNON.Vec3(0.5, 1.2, 0.3)),
                    position: new CANNON.Vec3(x, 3, 0),
                    fixedRotation: true
                });
                world.addBody(this.body);

                this.body.addEventListener("collide", () => { this.canJump = true; });
            }

            makeArm(mat, x, y) {
                const g = new THREE.Group();
                g.position.set(x, y, 0);
                const m = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.8, 0.25), mat);
                m.position.y = -0.3;
                g.add(m);
                return g;
            }

            update(t, targetX) {
                this.group.position.copy(this.body.position);

                // --- LÓGICA DE FICAR DE FRENTE ---
                // Se o inimigo está à direita, rotaciona para a direita, senão para a esquerda
                const targetRotation = this.body.position.x < targetX ? Math.PI / 2 : -Math.PI / 2;
                this.group.rotation.y = THREE.MathUtils.lerp(this.group.rotation.y, targetRotation, 0.2);

                // Animações
                if (this.isPunching) {
                    this.punchTimer += 0.15;
                    const punchEffect = Math.sin(this.punchTimer * Math.PI);
                    this.armR.rotation.x = -1.8 * punchEffect; // Soco pra frente
                    if (this.punchTimer >= 1) { this.isPunching = false; this.punchTimer = 0; }
                } else if (this.isDefending) {
                    this.armL.rotation.x = this.armR.rotation.x = -1.2; // Guarda alta
                } else {
                    // Balanço ao andar
                    const walk = (Math.abs(this.body.velocity.x) > 1) ? Math.sin(t * 12) * 0.5 : 0;
                    this.legL.rotation.x = walk;
                    this.legR.rotation.x = -walk;
                    this.armL.rotation.x = 0.2; 
                    this.armR.rotation.x = 0.2;
                }

                if (this.body.position.y < -10) this.die();
            }

            die() {
                this.hp = 0;
                document.getElementById('msg').style.display = 'block';
                setTimeout(() => location.reload(), 3000);
            }
        }

        const p1 = new Fighter(-5, 0x00ff88, 1);
        const p2 = new Fighter(5, 0xff3333, 2);

        const keys = {};
        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;

        function loop(t) {
            requestAnimationFrame(loop);
            world.step(1/60);
            
            const gps = navigator.getGamepads();
            const speed = 9;

            // Player 1 Input
            const gp1 = gps[0];
            p1.isDefending = keys['KeyQ'] || gp1?.buttons[1].pressed;
            if ((keys['Space'] || gp1?.buttons[2].pressed) && !p1.isPunching && !p1.isDefending) p1.isPunching = true;
            
            if (!p1.isDefending) {
                p1.body.velocity.x = (keys['KeyA'] ? -speed : keys['KeyD'] ? speed : (gp1?.axes[0] || 0) * speed);
                if ((keys['KeyW'] || gp1?.buttons[0].pressed) && p1.canJump && !p1.isPunching) {
                    p1.body.velocity.y = 15; p1.canJump = false;
                }
            } else { p1.body.velocity.x = 0; }

            // Player 2 Input
            const gp2 = gps[1];
            p2.isDefending = keys['Numpad0'] || gp2?.buttons[1].pressed;
            if ((keys['Numpad1'] || gp2?.buttons[2].pressed) && !p2.isPunching && !p2.isDefending) p2.isPunching = true;

            if (!p2.isDefending) {
                p2.body.velocity.x = (keys['ArrowLeft'] ? -speed : keys['ArrowRight'] ? speed : (gp2?.axes[0] || 0) * speed);
                if ((keys['ArrowUp'] || gp2?.buttons[0].pressed) && p2.canJump && !p2.isPunching) {
                    p2.body.velocity.y = 15; p2.canJump = false;
                }
            } else { p2.body.velocity.x = 0; }

            // Ataques
