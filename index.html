<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Paintball 3D Arena</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px;
            border: 2px solid white; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #ui {
            position: absolute; bottom: 20px; left: 20px;
            color: white; text-shadow: 1px 1px 2px black;
        }
        #msg {
            position: absolute; top: 20%; width: 100%; text-align: center;
            color: white; font-size: 1.2em; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui">
        <b>WASD</b>: Mover | <b>RATO</b>: Olhar | <b>CLIQUE</b>: Disparar
    </div>
    <div id="msg">Clique no ecrã para começar</div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';

        // --- Configuração Básica ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Céu azul
        scene.fog = new THREE.Fog(0x87ceeb, 10, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- Iluminação ---
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 10);
        light.castShadow = true;
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // --- Chão e Obstáculos ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x7cfc00 }) // Relva
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const obstacles = [];
        function createBox(x, z, color) {
            const box = new THREE.Mesh(
                new THREE.BoxGeometry(2, 3, 2),
                new THREE.MeshStandardMaterial({ color: color })
            );
            box.position.set(x, 1.5, z);
            box.castShadow = true;
            box.receiveShadow = true;
            scene.add(box);
            obstacles.push(box);
        }

        // Criar arena aleatória
        for(let i=0; i<20; i++) {
            createBox(Math.random()*40-20, Math.random()*40-20, 0x8b4513);
        }

        // --- Arma (Marcador) ---
        const weapon = new THREE.Mesh(
            new THREE.CylinderGeometry(0.05, 0.05, 0.5),
            new THREE.MeshStandardMaterial({ color: 0x333333 })
        );
        weapon.rotation.x = Math.PI / 2;
        weapon.position.set(0.3, -0.3, -0.5);
        camera.add(weapon);
        scene.add(camera);

        // --- Lógica de Disparo ---
        const balls = [];
        const ballMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });

        function shoot() {
            const ball = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), 
                new THREE.MeshStandardMaterial({ color: new THREE.Color(`hsl(${Math.random()*360}, 100%, 50%)`) }));
            
            // Posição inicial da bola na ponta da arma
            ball.position.copy(camera.position);
            
            // Direção do disparo baseada na câmara
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            
            ball.userData.velocity = direction.multiplyScalar(0.6);
            scene.add(ball);
            balls.push(ball);
        }

        // --- Controlos de Movimento (Pointer Lock) ---
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        
        document.addEventListener('mousedown', () => {
            if (document.pointerLockElement === document.body) {
                shoot();
            } else {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            }
        });

        // --- Loop Principal ---
        function animate() {
            requestAnimationFrame(animate);

            // Movimento do Jogador
            const speed = 0.1;
            if (moveForward) camera.translateZ(-speed);
            if (moveBackward) camera.translateZ(speed);
            if (moveLeft) camera.translateX(-speed);
            if (moveRight) camera.translateX(speed);
            camera.position.y = 1.6; // Altura dos olhos

            // Atualizar bolas de tinta
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];
                b.position.add(b.userData.velocity);
                b.userData.velocity.y -= 0.01; // Gravidade na bola

                // Colisão simples com o chão
                if (b.position.y <= 0) {
                    createSplat(b.position, b.material.color);
                    scene.remove(b);
                    balls.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        function createSplat(pos, color) {
            const splat = new THREE.Mesh(
                new THREE.CircleGeometry(0.3, 8),
                new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide })
            );
            splat.position.set(pos.x, 0.01, pos.z);
            splat.rotation.x = -Math.PI / 2;
            scene.add(splat);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
